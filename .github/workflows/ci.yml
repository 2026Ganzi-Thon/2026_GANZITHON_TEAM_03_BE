name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소하고, develop·main 푸시는 커밋마다 끝까지 실행합니다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 단위·MySQL 통합 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0.46
        env:
          # CI 전용 일회용 값입니다. 실제 서비스 비밀번호가 아닙니다.
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: maeum_member_test
          MYSQL_USER: maeum_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/maeum_member_test?connectionTimeZone=UTC
      TEST_MYSQL_USERNAME: maeum_test
      TEST_MYSQL_PASSWORD: ci-test-only

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # 단위 테스트가 실패해도 통합 테스트까지 실행해 한 번에 결과를 확인합니다.
      - name: 단위·MySQL 통합 테스트
        run: ./gradlew test mysqlIntegrationTest --continue

      - name: 실패한 테스트 리포트 업로드
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
