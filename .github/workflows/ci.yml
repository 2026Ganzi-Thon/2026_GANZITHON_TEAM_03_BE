name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 단위·MySQL 통합 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          # CI 전용 일회용 값입니다. 실제 서비스 비밀번호가 아닙니다.
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: maeum_member_test
          MYSQL_USER: maeum_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/maeum_member_test?connectionTimeZone=UTC
      TEST_MYSQL_USERNAME: maeum_test
      TEST_MYSQL_PASSWORD: ci-test-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew test

      - name: MySQL 통합 테스트
        run: ./gradlew mysqlIntegrationTest

      - name: 실패한 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
